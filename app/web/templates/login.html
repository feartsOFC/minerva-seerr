<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0a0a0a">
<title>Entrar · Minerva</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/minerva.css?v=5">
</head>
<body>
<main class="login">
  <form class="p" method="post" action="/login">
    <div class="rot"><b>ACESSO</b><span>REDE LOCAL</span></div>
    <h1>MINERVA</h1>
    <div class="sub">// PEDIDOS DE JOGOS <span class="cursor"></span></div>
    <label class="campo"><span>USUÁRIO</span><input type="text" name="nome" value="{{ nome or '' }}" autocomplete="username" autocapitalize="none" required autofocus></label>
    <label class="campo"><span>SENHA</span><input type="password" name="senha" autocomplete="current-password" required></label>
    {% if erro %}<p class="erro-msg">{{ erro }}</p>{% endif %}
    <button class="botao">Entrar</button>
  </form>
</main>
</body>
</html>
